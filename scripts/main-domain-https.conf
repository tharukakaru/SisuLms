server {
 listen 80;
 listen [::]:80;
 server_name sisuacademylk.com www.sisuacademylk.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/sisu-acme; try_files $uri =404; }
 location / { return 301 https://www.sisuacademylk.com$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name sisuacademylk.com;
 ssl_certificate /etc/letsencrypt/live/sisuacademylk.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/sisuacademylk.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 return 301 https://www.sisuacademylk.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sisuacademylk.com;

    ssl_certificate /etc/letsencrypt/live/sisuacademylk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sisuacademylk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    if ($host != "www.sisuacademylk.com") { return 444; }

    root /home/sisu/frappe-bench/sites;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        root /var/www/sisu-marketing-releases/20261101T201903806657Z;
        try_files /index.html =404;
    }
    location /assets/ {
        root /var/www/sisu-marketing-releases/20261101T201903806657Z;
        try_files $uri @bench_assets;
    }
    location @bench_assets { try_files $uri =404; }
    location ~ /\. { deny all; }
    location ~ ^/protected/(.*) {
        internal;
        try_files /sisuacademylk.com/$1 =404;
    }
    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name sisuacademylk.com;
        proxy_set_header Host sisuacademylk.com;
        proxy_set_header Origin https://www.sisuacademylk.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120;
        proxy_pass http://frappe-bench-socketio-server;
    }
    location ~* ^/files/.*\.(htm|html|svg|xml)$ {
        add_header Content-Disposition attachment;
        try_files /sisuacademylk.com/public/$uri @webserver;
    }
    location /files/ { try_files /sisuacademylk.com/public/$uri @webserver; }
    location / {
        root /var/www/sisu-marketing-releases/20261101T201903806657Z;
        index index.html;
        try_files $uri $uri/ @webserver;
    }
    location @webserver {
        proxy_http_version 1.1;
        proxy_set_header Host www.sisuacademylk.com;
        proxy_set_header X-Frappe-Site-Name sisuacademylk.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://frappe-bench-frappe;
    }
}
