[project]
name = "institute_lms"
version = "0.1.0"
description = "Sri Lankan institute operations for Frappe LMS"
authors = [{name = "Institute LMS contributors"}]
requires-python = ">=3.11"
dependencies = ["regex>=2024.11.6", "requests>=2.32.3", "Pillow>=11.1.0", "reportlab>=4.4,<5",
    "pypdf>=6.19.0,<7", "defusedxml>=0.7.1,<1"]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "institute_lms"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
lms = ">=2.0.0-dev"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../institute_lms/public/portal"
index_html_path = "../institute_lms/www/campus.html"

[project.optional-dependencies]
live = ["livekit-api>=1,<2"]
media = ["boto3>=1.35,<2"]
